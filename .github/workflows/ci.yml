name: CI

on:
  push:
    branches:
      - master
      - main
      - "codex/**"
  pull_request:

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22, 24, 26]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Run unit + module tests
        run: npm test

      - name: Verify package contents
        run: npm run pack:check

  smoke-latest-weasyprint:
    name: Smoke latest WeasyPrint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install WeasyPrint system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcairo2 \
            libpango-1.0-0 \
            libpangocairo-1.0-0 \
            libgdk-pixbuf-2.0-0 \
            libffi-dev \
            shared-mime-info \
            fonts-dejavu-core

      - name: Install latest WeasyPrint CLI
        run: |
          python -m pip install --upgrade pip
          python -m pip install weasyprint
          weasyprint --version

      - name: Install dependencies
        run: npm ci

      - name: Run real-world smoke test
        run: npm run test:real
